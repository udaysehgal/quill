name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # quill emits Apple Silicon code, so the tests run on an ARM64 Mac
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: end-to-end tests (each program also runs with a 1 KB heap)
        run: ./tests/run.sh
